services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: "${TARGET_BUILD:-development}"
    container_name: generate_word_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PROJECT_NAME=Generate Word API
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80","http://127.0.0.1:3000"]
    volumes:
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: generate_word_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
